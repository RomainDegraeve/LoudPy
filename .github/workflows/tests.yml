name: tests

on:
  push:
    branches: [main, dev, api-refresh]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"          # weekly, Monday 03:00 UTC: the slow cases (3D, convergence)
  workflow_dispatch:

env:
  MPLBACKEND: Agg
  NUMBA_CACHE_DIR: /tmp/numba-cache
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff (errors)
        run: ruff check src tests --select F,E9 --output-format=github

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: system libraries (gmsh, VTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libegl1 libxrender1 libxcursor1 libxft2 libxinerama1
      - run: pip install -e ".[all]" pytest
      - name: fast tests (regression, verification, results, plots)
        run: python -m pytest -q
      - name: slow tests (3D coupling, scenes)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m pytest -q --slow

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libegl1 libxrender1 libxcursor1 libxft2 libxinerama1
      - run: pip install -e ".[all]" -r docs/requirements.txt
      - name: build (warnings are errors)
        run: python -m sphinx -b html -W docs docs/_build/html
