[project]
name = "loudpy"
dynamic = ["version"]                         # from src/loudpy/__init__.py (__version__)
description = "Finite element simulation of loudspeakers: structure, air, radiation, 3D enclosures"
authors = [
    {name = "Romain Degraeve", email = "rom2graeve@gmail.com"},
]
requires-python = ">=3.13"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["finite elements", "acoustics", "loudspeaker", "fluid-structure interaction", "vibroacoustics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# the computational core; plotting, 3D views and tables are optional (extras below)
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.1",
    "numba>=0.61",
    "h5py>=3.12",
    "gmsh>=4.13",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.9.2", "pandas>=2.2.3"]
3d = ["pyvista>=0.44", "imageio>=2.35", "imageio-ffmpeg>=0.5"]
all = ["loudpy[plot,3d]"]

[project.urls]
Homepage = "https://github.com/RomainDegraeve/LoudPy"
Documentation = "https://github.com/RomainDegraeve/LoudPy/tree/main/docs"
Issues = "https://github.com/RomainDegraeve/LoudPy/issues"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.version]
source = "file"
path = "src/loudpy/__init__.py"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]
test = [
    "pytest>=8.0",
]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8.6",
]

[tool.pdm.build]
package-dir = "src"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::numba.core.errors.NumbaPerformanceWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905", "UP038"]       # short math names (l, I), zip strictness, isinstance tuples

[tool.ruff.lint.per-file-ignores]
"src/loudpy/__init__.py" = ["F401", "E402"]
"LoudPy_exemples/**" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["src/loudpy"]
ignore_missing_imports = true          # gmsh, numba, h5py, pyvista, scipy ship no (complete) stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "loudpy.plot.view3d"
disable_error_code = ["arg-type", "call-arg"]   # pyvista types its decorated Plotter methods as unbound functions
